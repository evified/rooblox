<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Rooblox · Bacon Baseplate</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8ebbd4;font:14px system-ui,sans-serif;color:white}canvas{display:block;touch-action:none;width:100vw;height:100dvh}.panel{position:fixed;background:#202329e8;backdrop-filter:blur(10px);border:1px solid #ffffff24;border-radius:9px;box-shadow:0 3px 15px #0002}header{top:16px;left:16px;padding:13px 16px}h1{margin:0 0 5px;font-size:17px;font-weight:650}.hint{font-size:12px;color:#d0d4d9}#state{color:#b8dfff}aside{top:16px;right:16px;width:232px;padding:14px}summary{font-weight:600;cursor:pointer}label{display:block;margin-top:12px;font-size:12px;color:#d0d4d9}select,button{font:inherit;color:white;background:#3a3e46;border:1px solid #ffffff25;border-radius:5px;padding:8px}select{width:100%;margin:6px 0 9px}button{cursor:pointer}button:hover{background:#4d535d}button:focus-visible,select:focus-visible{outline:2px solid #9ad0ff;outline-offset:2px}.row{display:flex;gap:6px}.row button{flex:1}.stats{margin-top:13px;display:grid;grid-template-columns:1fr auto;gap:5px;color:#cbd0d7;font-size:12px}.stats span:nth-child(even){color:white;font-variant-numeric:tabular-nums}footer{bottom:16px;left:16px;padding:10px 13px;font-size:12px;color:#d0d4d9}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#202329;z-index:5;font-size:18px}#touch{display:none;position:fixed;bottom:70px;left:20px;gap:6px;grid-template-columns:repeat(3,45px)}#touch button{height:45px;touch-action:none}#jump{position:fixed;bottom:80px;right:24px;display:none;width:65px;height:65px;border-radius:50%;touch-action:none}#lock[aria-pressed=true]{background:#3571a3}@media(pointer:coarse){#touch{display:grid}#jump{display:block}}@media(max-width:650px){header{right:16px}aside{top:91px;width:200px}aside:not([open]){width:auto}footer{max-width:calc(100vw - 32px)}.hint{font-size:11px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body>
<header class="panel"><h1>Rooblox <span style="font-weight:400;color:#bdc6cf">/ Baseplate</span></h1><div class="hint">Bacon Hair · <span id="state">Loading</span></div></header>

<footer class="panel">WASD / arrows · Space to jump · drag to look · scroll to zoom · Shift to lock</footer>
<div id="touch"><span></span><button data-key="KeyW" aria-label="Forward">↑</button><span></span><button data-key="KeyA" aria-label="Left">←</button><button data-key="KeyS" aria-label="Backward">↓</button><button data-key="KeyD" aria-label="Right">→</button></div><button id="jump" aria-label="Jump">Jump</button><div id="loading" role="status">Loading Bacon Hair…</div>
<script type="module" src="./game.js"></script></body></html>
