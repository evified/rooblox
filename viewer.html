<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Native Studio bacon avatar</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#c9dce7;color:#213246}
    canvas{display:block;width:100vw;height:100dvh}.info{position:absolute;top:20px;left:24px;right:24px}
    h1{font-size:21px;font-weight:600;margin:0 0 4px}p{font-size:13px;margin:5px 0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    button{font:inherit;font-size:13px;border:1px solid #819bad;border-radius:5px;background:#e9f1f6;color:#213246;padding:7px 10px;cursor:pointer}
    button[aria-pressed=true]{background:#213246;color:#fff}#texture-toggle{margin-left:8px}#status{color:#415a6e}
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <div class="info"><h1>Bacon Hair · native Studio export</h1><p id="status" role="status">Loading…</p>
    <div class="controls" aria-label="Reference camera angles">
      <button data-view="front">Front</button><button data-view="back">Back</button><button data-view="left">Left</button><button data-view="right">Right</button><button data-view="three-quarter" aria-pressed="true">Three-quarter</button>
      <button id="texture-toggle" aria-pressed="false">Texture colors</button>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { loadBacon } from './load-bacon.js';
    const reference=await fetch('./assets/studio-reference.json').then(r=>r.json());
    const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9c9d9);
    const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,3));renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=5;controls.maxDistance=25;controls.maxPolarAngle=Math.PI*.49;
    const hemi=new THREE.HemisphereLight(0xa3e0ff,0x7699c4,3.5);scene.add(hemi);
    const ambient=new THREE.AmbientLight(0xffffff,.7);scene.add(ambient);
    const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.fromArray(reference.lighting.sunDirection).multiplyScalar(30);sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-7;sun.shadow.camera.right=7;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-7;sun.shadow.normalBias=.015;scene.add(sun);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0xaab9c7,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;floor.receiveShadow=true;scene.add(floor);
    function setView(name){const view=reference.views[name];camera.position.fromArray(view.position);camera.fov=view.fov;camera.updateProjectionMatrix();controls.target.fromArray(view.target);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));}
    document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));setView('three-quarter');
    try{
      const bacon=await loadBacon(scene);const meshes=[];
      bacon.avatar.traverse(o=>{if(o.isMesh){meshes.push(o);o.material.map.anisotropy=renderer.capabilities.getMaxAnisotropy();o.material.map.needsUpdate=true;o.userData.litMaterial=o.material;o.userData.textureMaterial=new THREE.MeshBasicMaterial({map:o.material.map,side:o.material.side});}});
      document.getElementById('texture-toggle').addEventListener('click',()=>{const button=document.getElementById('texture-toggle');const unlit=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(unlit));meshes.forEach(m=>m.material=unlit?m.userData.textureMaterial:m.userData.litMaterial);});
      document.getElementById('status').textContent='Original geometry, UVs, normals, and Studio-baked texture · drag to orbit';
      window.baconPreview={scene,camera,renderer,controls,bacon,meshes,floor,setView,reference,THREE};window.avatarReady=true;
    }catch(error){document.getElementById('status').textContent=error.message;console.error(error);}
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
  </script>
</body>
</html>
