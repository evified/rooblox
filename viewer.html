<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bacon avatar preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #dce4ed; color: #233247; }
    canvas { display: block; width: 100vw; height: 100dvh; }
    .info { position: absolute; top: 20px; left: 24px; right: 24px; pointer-events: none; }
    h1 { font-size: 22px; margin: 0 0 5px; font-weight: 600; }
    p { margin: 4px 0; font-size: 14px; }
    #status { color: #42536b; }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div class="info"><h1>Bacon Hair · R6</h1><p>Drag to orbit · Scroll to zoom</p><p id="status" role="status">Loading avatar…</p></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { loadBacon } from './load-bacon.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce4ed);
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7, 5.5, -11);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.append(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.7, 0);
    controls.enableDamping = true;
    controls.minDistance = 5;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI * 0.49;
    scene.add(new THREE.HemisphereLight(0xffffff, 0xa6b2c2, 2));
    const key = new THREE.DirectionalLight(0xffffff, 3);
    key.position.set(-4, 9, -6); key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -6; key.shadow.camera.right = 6;
    key.shadow.camera.top = 8; key.shadow.camera.bottom = -6;
    key.shadow.normalBias = 0.02;
    scene.add(key);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({color: 0xc8d3e0, roughness: 1}));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.02;
    floor.receiveShadow = true;
    scene.add(floor);
    try {
      const bacon = await loadBacon(scene);
      document.getElementById('status').textContent = 'Loaded · embedded textures · joint pivots ready';
      window.baconPreview = {scene, camera, renderer, bacon};
      window.avatarReady = true;
    } catch (error) {
      document.getElementById('status').textContent = 'Could not load avatar: ' + error.message;
      console.error(error);
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
